<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Трекер привычек</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0d19; --card:#16162a; --card2:#1f1f36; --line:rgba(255,255,255,.07);
  --text:#f5f5fb; --hint:#8c8ca8; --dim:#3d3d5a;
  --grad:linear-gradient(135deg,#7a4dff 0%,#b14fd6 55%,#e5508a 100%);
  --purple:#a48bff; --teal:#3fd6ab; --ice:#5aa8ff; --danger:#ff6b7a; --gold:#ffc35a;
  --disp:Unbounded,Manrope,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.35 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 16px calc(120px + env(safe-area-inset-bottom));min-height:100vh;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{opacity:.3;cursor:default}
input{font:inherit;color:var(--text)}
#app{max-width:560px;margin:0 auto}
.disp,.h1{font-family:var(--disp);font-weight:700;letter-spacing:-.02em}
.ic{display:block;flex:none}
.loading{display:grid;place-items:center;height:80vh}

/* ---------- анимации ---------- */
.view.enter.push{animation:pushIn .42s var(--ease) both}
.view.enter.fade{animation:fadeIn .35s var(--ease) both}
.view.enter .st{animation:up .55s var(--ease) both;animation-delay:calc(var(--i,0) * 50ms)}
.view.enter .cd,.view.enter .mc{animation:cellIn .45s var(--spring) both;animation-delay:calc(var(--j,0) * 12ms + 120ms)}
@keyframes pushIn{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes cellIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.82)}45%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes burst{from{transform:scale(1);opacity:.9}to{transform:scale(2);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}25%{transform:scale(1.02,1.05) skewX(-1.6deg)}50%{transform:scale(.99,.97) skewX(1.2deg)}75%{transform:scale(1.015,1.04) skewX(-.6deg)}}
@keyframes flick2{0%,100%{transform:scale(1,1)}40%{transform:scale(.88,1.1)}70%{transform:scale(1.05,.95)}}
@keyframes glow{0%,100%{opacity:.75;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes fabGlow{0%,100%{box-shadow:0 12px 30px -8px rgba(176,79,214,.75)}50%{box-shadow:0 12px 38px -4px rgba(229,80,138,.9)}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes typing{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}

/* ---------- шапка ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 2px 16px}
.date{color:var(--hint);font-size:14px;font-weight:600}
.h1{font-size:27px;margin:4px 0 0;line-height:1.15}
.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);flex:none;transition:transform .2s var(--spring)}
.iconbtn:active{transform:scale(.9)}
.nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0 10px;min-height:62px}
.back{display:flex;align-items:center;gap:6px;color:var(--purple);font-weight:700;font-size:16px;padding:6px 0}
.navnote{color:var(--hint);font-weight:600;font-size:14px}

/* ---------- карточки ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.card-h b{font-size:16px;font-weight:800}
.card-h span{color:var(--hint);font-size:13px;font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 12px}
.sec h2{font-family:var(--disp);font-weight:700;font-size:19px;margin:0}
.sec span{color:var(--hint);font-size:14px;font-weight:600}

/* ---------- герой «Прогресс дня» ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:18px;background:var(--grad);display:flex;gap:18px;align-items:center;margin-bottom:12px;box-shadow:0 22px 44px -22px rgba(176,79,214,.75)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09);pointer-events:none}
.hero::before{width:230px;height:230px;right:-80px;top:-100px}
.hero::after{width:170px;height:170px;right:40px;bottom:-120px}
.hero-ring{position:relative;flex:none;width:124px;height:124px}
.hero-ring .ring{position:absolute;inset:0}
.hero-pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:25px}
.hero-txt{position:relative;z-index:1;min-width:0}
.hero-l{font-weight:700;font-size:14px;opacity:.92}
.hero-n{font-family:var(--disp);font-weight:700;font-size:29px;margin:3px 0 4px}
.hero-s{font-size:14px;font-weight:600;opacity:.95}
.chips{display:flex;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:14px;transition:transform .2s var(--spring)}
.chip:active{transform:scale(.92)}
.banner{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.banner .bi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.banner.ice{border-color:rgba(90,168,255,.35)} .banner.ice .bi{background:rgba(90,168,255,.15);color:var(--ice)}
.banner.miss .bi{background:rgba(255,107,122,.14);color:var(--danger)}

/* ---------- календарь 4 недели ---------- */
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 4px;justify-items:center}
.g7 .wd{font-size:12px;color:var(--hint);font-weight:700}
.cd{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--text);transition:transform .2s var(--spring)}
.cd:active{transform:scale(.88)}
.cd .ring{position:absolute;inset:0}
.cd span{position:relative}
.cd.full{background:var(--grad);box-shadow:0 8px 18px -8px rgba(176,79,214,.85)}
.cd.fut{color:var(--dim)}
.cd.none{color:var(--hint)}
.cd.sel::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid #fff}

/* ---------- привычки в списке ---------- */
.hc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:12px;margin-bottom:10px;cursor:pointer;transition:transform .18s var(--ease),border-color .3s}
.hc:active{transform:scale(.98)}
.hc.done{border-color:rgba(164,139,255,.18)}
.hic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;flex:none;color:var(--c)}
.emo{font-size:22px;line-height:1}
.meta{flex:1;min-width:0}
.nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{color:var(--hint);font-size:13px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--dim);color:transparent;transition:transform .2s var(--spring),background .25s,border-color .25s,box-shadow .25s}
.ck:active{transform:scale(.86)}
.ck.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 22px -10px rgba(176,79,214,.9)}
.ck.pop{animation:pop .55s var(--spring)}
.ck.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid #c35fd4;animation:burst .65s var(--ease) forwards;pointer-events:none}
.ck.on.pop svg path{stroke-dasharray:24;stroke-dashoffset:24;animation:draw .45s .12s var(--ease) forwards}
.ck.cnt{border:0;color:var(--purple)}
.ck.cnt .ring{position:absolute;inset:0}
.ck.cnt i{position:relative;display:grid}
.cntw{display:flex;align-items:center;gap:8px;flex:none}
.mini{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--hint);transition:transform .2s var(--spring)}
.mini:active{transform:scale(.85)}
.slip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--dim);color:var(--hint);font-size:13px;font-weight:800;flex:none;transition:all .25s var(--ease)}
.slip.on{background:rgba(255,107,122,.15);border-color:var(--danger);color:var(--danger)}
/* свайп для удаления */
.swr{position:relative;margin-bottom:10px;border-radius:22px}
.swr .hc{margin-bottom:0;position:relative;z-index:1;touch-action:pan-y}
.swb{position:absolute;inset:0;border-radius:22px;background:linear-gradient(270deg,#ff4d6d,#ff6b7a 55%,rgba(255,107,122,.25));display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:22px;color:#fff;font-weight:800;font-size:15px;opacity:0;transition:opacity .2s,background .25s}
.swb .ic{transform:scale(calc(.75 + var(--sp,0) * .25));transition:transform .25s var(--spring)}
.swr.swiping .swb{opacity:1}
.swr.armed .swb{background:#ff4d6d}
.swr.armed .swb .ic{transform:scale(1.25)}
.swr.gone{overflow:hidden}
.swr.nudge .hc{animation:nudge 1.2s 1s var(--ease)}
.swr.nudge .swb{animation:peek 1.2s 1s}
@keyframes nudge{0%,100%{transform:none}35%{transform:translateX(-64px)}65%{transform:translateX(0)}}
@keyframes peek{0%,100%{opacity:0}20%,60%{opacity:1}}
.hint{text-align:center;color:var(--hint);font-size:13px;font-weight:600;margin:6px 0 0}
.rest{text-align:center;color:var(--hint);padding:24px 0;font-weight:600}

/* ---------- пустое состояние ---------- */
.empty{text-align:center;padding:10px 6px 18px}
.empty .flame{margin:0 auto}
.empty h3{font-family:var(--disp);font-size:20px;margin:12px 0 6px}
.empty p{color:var(--hint);margin:0 0 4px;font-weight:600}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.preset{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:700;font-size:14px;transition:transform .18s var(--ease)}
.preset:active{transform:scale(.96)}
.preset .hic{width:38px;height:38px;border-radius:12px}

/* ---------- нижние панели ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;align-items:center;background:rgba(17,17,31,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 24px calc(10px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--hint);width:96px;transition:color .2s}
.tab.on{color:var(--text)}
.fab{width:64px;height:64px;border-radius:22px;background:var(--grad);display:grid;place-items:center;color:#fff;margin-top:-36px;animation:fabGlow 3s ease-in-out infinite;transition:transform .25s var(--spring)}
.fab:active{transform:scale(.88) rotate(90deg)}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,rgba(13,13,25,0))}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:560px;margin:0 auto;height:58px;border-radius:20px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;box-shadow:0 16px 32px -14px rgba(176,79,214,.9);transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:scale(.97);filter:brightness(1.1)}
.btn.dark{background:var(--card2);border:1px solid var(--line);box-shadow:none}
.btn.dark .ic{color:var(--gold)}
.tbtn{display:block;margin:6px auto 0;padding:12px;color:var(--danger);font-weight:700}

/* ---------- экран привычки ---------- */
.ttl{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.ttl .hic{width:58px;height:58px;border-radius:18px}
.ttl h1{font-family:var(--disp);font-weight:700;font-size:23px;margin:0;line-height:1.15}
.ttl p{margin:4px 0 0;color:var(--hint);font-weight:600;font-size:14px}
.scard{position:relative;overflow:hidden;background:var(--grad);border-radius:26px;padding:18px;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;box-shadow:0 22px 44px -22px rgba(176,79,214,.75)}
.scard::before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);left:-60px;bottom:-120px}
.scard>*{position:relative}
.scard .l{display:flex;gap:6px;align-items:center;font-weight:800;font-size:14px}
.scard .big{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.scard .big b{font-family:var(--disp);font-weight:800;font-size:56px;line-height:1}
.scard .big span{font-weight:700;font-size:15px}
.scard .rec{background:rgba(255,255,255,.18);border-radius:18px;padding:10px 14px;text-align:right;font-weight:700;font-size:13px}
.scard .rec b{display:block;font-family:var(--disp);font-size:19px;margin-top:3px}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:13px}
.tile b{display:block;font-family:var(--disp);font-weight:700;font-size:20px;white-space:nowrap}
.tile span{color:var(--hint);font-size:12px;font-weight:600}
.tile .tl{display:flex;gap:6px;align-items:center;color:var(--hint);font-size:13px;font-weight:700;margin-bottom:6px}
.t2 .tile b{font-size:24px}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.mcal .wd{text-align:center;font-size:12px;color:var(--hint);font-weight:700;padding-bottom:4px}
.mc{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(255,255,255,.045);color:var(--hint);transition:transform .2s var(--spring)}
.mc:active{transform:scale(.85)}
.mc.done{background:var(--c);color:#1b1408}
.mc.part{background:linear-gradient(to top,var(--c) var(--p),rgba(255,255,255,.045) var(--p));color:var(--text)}
.mc.slip{background:rgba(255,107,122,.16);color:var(--danger)}
.mc.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.mc.off{opacity:.4}
.mc.blank{visibility:hidden}
.mnav{display:flex;align-items:center;gap:6px}
.mnav button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--hint)}
.legend{display:flex;align-items:center;gap:6px;color:var(--hint);font-size:13px;font-weight:700}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c)}
.rrow{display:flex;align-items:center;gap:12px}
.rrow .bi{width:44px;height:44px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.rrow .meta b{display:block;font-weight:800;font-size:16px}
.rrow .meta span{color:var(--hint);font-size:13px;font-weight:600}

/* ---------- переключатели ---------- */
.sw{width:54px;height:32px;border-radius:16px;background:var(--dim);position:relative;transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .35s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw.on{background:var(--grad)}
.sw.on::after{transform:translateX(22px)}
.seg{position:relative;display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px;--x:0;--n:2}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));transform:translateX(calc(var(--x) * 100%));background:var(--grad);border-radius:14px;transition:transform .35s var(--spring);box-shadow:0 8px 20px -10px rgba(176,79,214,.9)}
.seg button{position:relative;flex:1;padding:13px 4px;font-weight:800;font-size:14px;color:var(--hint);transition:color .25s}
.seg button.on{color:#fff}
.time{-webkit-appearance:none;appearance:none;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:inherit;font-weight:800;font-size:15px;color:var(--text);outline:none;min-width:76px;text-align:center;text-align-last:center;color-scheme:dark;flex:none}
.time::-webkit-calendar-picker-indicator{display:none}

/* ---------- форма ---------- */
.fh{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;padding:16px 0 4px}
.fh .t{font-family:var(--disp);font-weight:700;font-size:19px;text-align:center;line-height:1.2}
.lk{color:var(--purple);font-weight:700;font-size:15px;text-align:left}
.flbl{color:var(--hint);font-weight:700;font-size:14px;margin:20px 2px 10px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px 16px;font:inherit;font-size:16px;font-weight:600;color:var(--text);outline:none;transition:border-color .25s,box-shadow .25s}
.inp::placeholder{color:#6b6b88}
.inp:focus{border-color:rgba(164,139,255,.6);box-shadow:0 0 0 4px rgba(122,77,255,.15)}
.inp.sm{padding:12px 14px;font-size:14px;border-radius:14px;margin-top:8px}
.icg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icg button{height:60px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--text);transition:transform .25s var(--spring),border-color .2s,background .2s,color .2s}
.icg button:active{transform:scale(.9)}
.icg button.on{border-color:var(--c);color:var(--c);transform:scale(1.04)}
.clr{display:flex;justify-content:space-between;gap:6px}
.clr button{width:48px;height:48px;border-radius:50%;transition:transform .3s var(--spring),box-shadow .2s}
.clr button:active{transform:scale(.85)}
.clr button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff;transform:scale(1.06)}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.dchips button{height:46px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--hint);transition:all .2s var(--ease)}
.dchips button.on{border-color:rgba(164,139,255,.75);color:var(--text);background:rgba(122,77,255,.16)}
.box{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.box .meta b{display:block;font-weight:800;font-size:16px}
.box .meta span{color:var(--hint);font-size:13px;font-weight:600}
.step{display:flex;align-items:center;gap:8px;flex:none}
.step button{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;transition:transform .2s var(--spring)}
.step button:active{transform:scale(.85)}
.step .val{font-family:var(--disp);font-weight:700;font-size:19px;text-align:center;min-width:58px;line-height:1.05}
.step .val small{display:block;font-size:12px;font-weight:600;color:var(--hint);font-family:Manrope,-apple-system,sans-serif}
.step .val.bump{animation:bump .35s var(--spring)}
.subopts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.subopts button{padding:9px 14px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);font-weight:800;font-size:13px;color:var(--hint);transition:all .2s}
.subopts button.on{border-color:rgba(164,139,255,.75);color:var(--text);background:rgba(122,77,255,.16)}
.note{color:var(--hint);font-size:13px;font-weight:600;margin-top:8px}

/* ---------- статистика ---------- */
.big{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.big .k{color:var(--hint);font-weight:700;font-size:14px;max-width:140px}
.big .v{font-family:var(--disp);font-weight:800;font-size:44px;line-height:1.05;margin:6px 0 4px}
.big .s{color:var(--hint);font-weight:600;font-size:14px}
.delta{display:inline-flex;gap:6px;align-items:center;border-radius:16px;padding:9px 13px;font-weight:800;font-size:13px;background:rgba(63,214,171,.12);color:var(--teal);max-width:150px}
.delta.neg{background:rgba(255,107,122,.12);color:var(--danger)}
.bars{display:flex;justify-content:space-around;align-items:flex-end;height:170px;margin-top:20px}
.bar{display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end;flex:1}
.bar .v2{font-size:12px;color:var(--hint);font-weight:800}
.bar .trk{flex:1;width:36px;display:flex;align-items:flex-end}
.bar .f{width:100%;border-radius:12px;background:#38315f}
.bar.hi .f{background:linear-gradient(to top,#7a4dff,#e5508a);box-shadow:0 10px 24px -10px rgba(229,80,138,.9)}
.bar .x{font-size:13px;font-weight:800}
.hb{margin-bottom:16px}
.hb-h{display:flex;justify-content:space-between;font-weight:800;margin-bottom:9px}
.pb{height:9px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.pb i{display:block;height:100%;border-radius:5px;background:var(--c,var(--grad))}

/* ---------- серия ---------- */
.sk{text-align:center;position:relative;padding:4px 0 14px}
.sk-glow{position:absolute;left:50%;top:-10px;width:300px;height:300px;transform:translateX(-50%);background:radial-gradient(circle,rgba(240,80,126,.38),rgba(122,77,255,.16) 45%,transparent 70%);animation:glow 3.2s ease-in-out infinite;pointer-events:none}
.sk .flame{position:relative;margin:0 auto}
.sk-n{position:relative;font-family:var(--disp);font-weight:800;font-size:76px;line-height:1;margin-top:2px}
.sk-l{position:relative;font-weight:800;font-size:18px;margin:6px 0 14px}
.pill{position:relative;display:inline-flex;gap:7px;align-items:center;border-radius:999px;padding:8px 15px;font-weight:800;font-size:14px}
.pill.ok{background:rgba(63,214,171,.12);color:var(--teal)}
.pill.wait{background:rgba(164,139,255,.13);color:var(--purple)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.wk .c{width:min(42px,100%);aspect-ratio:1;margin:0 auto 6px;border-radius:50%;background:var(--card2);display:grid;place-items:center}
.wk .c.today{box-shadow:0 0 0 2px #f0507e}
.wk .c.miss{color:var(--dim)}
.wk .c.ice{color:var(--ice);background:rgba(90,168,255,.12)}
.wk span{font-size:12px;font-weight:800;color:var(--hint)}
.wk span.t{color:#f0507e}
.fz{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.fz-s{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;flex:none}
.fz-s.on{background:linear-gradient(135deg,#8ccaff,#3b82f6);color:#fff;box-shadow:0 12px 26px -12px rgba(90,168,255,.9)}
.fz-s.off{border:2px dashed var(--dim);color:var(--dim)}
.fz b{font-family:var(--disp);font-size:17px;display:block}
.fz span{color:var(--hint);font-size:13px;font-weight:600}
.fzp{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:9px}
.fzp em{font-style:normal;color:var(--ice)}
.pb.ice i{background:linear-gradient(90deg,#3b82f6,#8ccaff)}
.small{color:var(--hint);font-size:13px;font-weight:600;margin-top:10px}

/* ---------- напоминания ---------- */
.pv{position:relative;overflow:hidden;background:radial-gradient(120% 120% at 0% 0%,rgba(122,77,255,.32),transparent 60%),radial-gradient(100% 100% at 100% 100%,rgba(229,80,138,.24),transparent 60%),var(--card);border:1px solid var(--line);border-radius:26px;padding:14px 14px 14px;margin-bottom:6px}
.pv .cap{color:var(--hint);font-weight:700;font-size:13px;margin-bottom:10px}
.pvb{display:flex;gap:10px;align-items:flex-end}
.ava{width:40px;height:40px;border-radius:50%;background:var(--grad);display:grid;place-items:center;flex:none}
.bub{flex:1;animation:bubbleIn .5s .35s var(--spring) both}
.bub .msg{background:var(--card2);border-radius:20px 20px 20px 6px;padding:12px 14px 8px}
.bub .msg b{display:block;font-weight:800;margin-bottom:3px}
.bub .msg p{margin:0;font-weight:600;font-size:14px;line-height:1.4}
.bub .msg time{display:block;text-align:right;color:var(--hint);font-size:11px;font-weight:700;margin-top:4px}
.bub .open{margin-top:6px;background:rgba(122,77,255,.16);border-radius:14px;padding:11px;text-align:center;color:var(--purple);font-weight:800;font-size:14px}
.dots{display:inline-flex;gap:4px;padding:14px 16px;background:var(--card2);border-radius:20px 20px 20px 6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--hint);animation:typing 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.lbl{color:var(--hint);font-size:14px;font-weight:700;margin:20px 4px 10px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:66px}
.row+.row{border-top:1px solid var(--line)}
.row .meta b{display:block;font-weight:800;font-size:16px}
.row .meta span{color:var(--hint);font-size:13px;font-weight:600}
.row .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.row .rv{color:var(--hint);font-weight:700;font-size:14px}
.row .chev{color:var(--hint)}

/* ---------- всплывающее ---------- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(5,5,12,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:16px;animation:fadeIn .2s}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:10px;margin-bottom:env(safe-area-inset-bottom);animation:sheetIn .38s var(--spring)}
.sheet p{margin:12px 12px 14px;text-align:center;font-weight:700}
.sheet .sb2{display:flex;gap:12px;align-items:center;width:100%;padding:15px 14px;border-radius:16px;font-weight:800;font-size:16px}
.sheet .sb2:active{background:var(--card2)}
.sheet .danger{color:var(--danger)}
.sheet .row2{display:flex;gap:8px}
.sheet .row2 .btn{height:52px;font-size:15px}
.sheet .row2 .btn.red{background:var(--danger);box-shadow:none}
.toast.undo{display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;overflow:hidden}
.toast.undo button{color:var(--purple);font-weight:800;padding:8px 12px;border-radius:12px;background:rgba(122,77,255,.18);flex:none}
.toast.undo::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--grad);animation:shrink 5s linear forwards}
@keyframes shrink{to{width:0}}
.toast{position:fixed;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(112px + env(safe-area-inset-bottom));background:rgba(31,31,54,.96);border:1px solid var(--line);color:#fff;padding:12px 18px;border-radius:16px;font-size:14px;font-weight:700;z-index:60;max-width:90vw;text-align:center;animation:sheetIn .35s var(--spring);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}

/* ---------- огонёк ---------- */
.flame .fo{transform-origin:50% 100%;transform-box:fill-box;animation:flick 1.7s ease-in-out infinite}
.flame .fi{transform-origin:50% 100%;transform-box:fill-box;animation:flick2 1.15s ease-in-out infinite}
.flame.off{filter:grayscale(1) brightness(.75);opacity:.5}
.flame.off .fo,.flame.off .fi{animation:none}

/* ---------- праздник ---------- */
.cele{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(8,8,18,0);backdrop-filter:blur(0);-webkit-backdrop-filter:blur(0);transition:background .35s,backdrop-filter .35s}
.cele.show{background:rgba(8,8,18,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cele.hide{opacity:0;transition:opacity .35s}
.cele-in{position:relative;text-align:center;transform:scale(.4);opacity:0;transition:transform .7s var(--spring),opacity .3s}
.cele.show .cele-in{transform:none;opacity:1}
.cele-glow{position:absolute;left:50%;top:-40px;width:340px;height:340px;transform:translateX(-50%);background:radial-gradient(circle,rgba(255,140,80,.5),rgba(229,80,138,.25) 40%,transparent 70%);animation:glow 1.6s ease-in-out infinite}
.cele-parts{position:absolute;left:50%;top:80px}
.cele-parts i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;opacity:0}
.cele.show .cele-parts i{animation:fly 1.1s var(--d) var(--ease) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
.cele-n{position:relative;font-family:var(--disp);font-weight:800;font-size:84px;line-height:1;margin-top:4px}
.cele-t{position:relative;font-weight:800;font-size:19px;margin-top:6px}
.cele-s{position:relative;color:var(--teal);font-weight:800;margin-top:12px}

/* ---------- v2: уровни, XP, лига ---------- */
.headr{display:flex;gap:8px;align-items:center}
.lvchip{display:flex;align-items:center;gap:6px;height:46px;padding:0 14px 0 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:14px;transition:transform .2s var(--spring)}
.lvchip:active{transform:scale(.92)}
.lvchip .lr{position:relative;width:34px;height:34px;display:grid;place-items:center;font-family:var(--disp);font-size:14px}
.lvchip .lr .ring{position:absolute;inset:0}
.lvchip .lr b{position:relative}
.chip{white-space:nowrap}
.chips{flex-wrap:wrap}
.chip.xp{background:#fff;color:#7a3fd6}
.chip.xp.bump{animation:bump .5s var(--spring)}
.upd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:linear-gradient(90deg,rgba(122,77,255,.18),rgba(229,80,138,.12));border:1px solid rgba(164,139,255,.3);border-radius:18px;padding:11px 12px;margin-bottom:12px;font-weight:700;font-size:14px}
.upd .nb{flex:none;font-size:11px;font-weight:800;letter-spacing:.5px;padding:4px 8px;border-radius:8px;background:var(--grad);color:#fff}
.upd span.t{flex:1;min-width:0}
.upd small{display:block;color:var(--hint);font-weight:600;font-size:12px;margin-top:1px}
.upd .ic{color:var(--hint);flex:none}
.bkic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(47,212,180,.14);color:#2fd4b4;flex:none}
.wn h3{font-family:var(--disp);font-size:20px;margin:8px 8px 2px}
.wn .ver{color:var(--hint);font-weight:600;font-size:13px;margin:0 8px 10px}
.wn ul{list-style:none;margin:0 0 12px;padding:0}
.wn li{display:flex;gap:12px;align-items:flex-start;padding:10px 8px}
.wn li+li{border-top:1px solid var(--line)}
.wn .wi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(122,77,255,.16);color:var(--purple)}
.wn li b{display:block;font-weight:800}
.wn li span{color:var(--hint);font-size:13px;font-weight:600}
.ro-note{display:flex;gap:10px;align-items:center;background:var(--card);border:1px dashed rgba(164,139,255,.35);border-radius:16px;padding:10px 12px;margin:0 0 10px;font-size:13px;font-weight:600;color:var(--hint)}
.ro-note .ic{color:var(--purple);flex:none}
.ro-note button{margin-left:auto;color:var(--purple);font-weight:800;flex:none}
.ck.ro,.slip.ro{opacity:.55;pointer-events:none}
.mc.nb{cursor:default}
/* таббар на 5 пунктов */
.tabs{padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.tab{width:auto;flex:1;max-width:84px;font-size:11px}
.fab{flex:none;margin:-36px 6px 0}
/* уровень */
.lvhero{text-align:center;position:relative;padding:6px 0 4px}
.lvring{position:relative;width:190px;height:190px;margin:0 auto}
.lvring .ring{position:absolute;inset:0}
.lvcore{position:absolute;inset:26px;border-radius:50%;background:var(--grad);display:grid;place-items:center;align-content:center;box-shadow:0 20px 50px -18px rgba(176,79,214,.9)}
.lvcore small{font-weight:800;font-size:12px;letter-spacing:1.5px;opacity:.9}
.lvcore b{font-family:var(--disp);font-size:58px;line-height:1}
.lvhero .sk-glow{top:-30px}
.lvt{font-family:var(--disp);font-weight:700;font-size:24px;margin-top:14px;position:relative}
.lvs{color:var(--hint);font-weight:600;font-size:14px;position:relative}
.lvp{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin:18px 2px 8px}
.lvp span{color:var(--hint);font-weight:600}
.pb.big{height:12px;border-radius:6px;margin-bottom:14px}
.tile .gold{color:var(--gold)}
.mchip{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:6px 11px;font-weight:800;font-size:12px;background:rgba(255,107,122,.14);color:#ff8a95}
.mchip.off{background:var(--soft);color:var(--hint)}
.earn{display:flex;align-items:center;gap:12px;padding:9px 0}
.earn .bi{width:40px;height:40px;border-radius:12px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--text)}
.earn span{flex:1;font-weight:700}
.earn b{font-weight:800;color:var(--gold)}
.xrow{display:flex;align-items:center;gap:12px;padding:13px 16px}
.xrow+.xrow{border-top:1px solid var(--line)}
.xrow .dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.xrow .meta b{display:block;font-weight:800}
.xrow .meta span{color:var(--hint);font-size:12px;font-weight:600}
.xrow .v{font-weight:800;color:var(--gold)}
.xrow.pend .v{color:var(--hint)}
.xrow .dash{width:12px;height:12px;border-radius:50%;border:2px dashed var(--hint);flex:none}
.rw{position:relative;padding-left:4px}
.fz{flex-wrap:wrap}
.fz>div:last-child{flex:1;min-width:170px}
.rw-i{display:flex;align-items:center;gap:14px;padding:8px 0;position:relative}
.rw-i:not(:last-child)::after{content:"";position:absolute;left:25px;top:52px;bottom:-8px;width:2px;background:var(--line)}
.rw-n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:16px;flex:none;background:var(--card2);color:var(--hint);border:2px solid var(--line);position:relative;z-index:1}
.rw-i.got .rw-n{background:var(--grad);color:#fff;border-color:transparent}
.rw-i.cur .rw-n{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 0 0 3px var(--bg),0 0 0 5px rgba(255,255,255,.8)}
.rw-i.next .rw-n{border-color:var(--purple);color:var(--text)}
.rw-i .meta{flex:1}
.rw-i .meta b{display:block;font-weight:800}
.rw-i .meta span{color:var(--hint);font-size:13px;font-weight:600}
.rw-i.cur .meta span{color:var(--purple)}
.rw-r{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--hint)}
.rw-r.ok{color:var(--teal)}
.rw-r.ice{background:rgba(90,168,255,.14);color:var(--ice)}
/* новый уровень */
.lvup{position:fixed;inset:0;z-index:80;background:radial-gradient(80% 50% at 50% 30%,rgba(176,79,214,.35),transparent 70%),#0a0a14;display:flex;flex-direction:column;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));opacity:0;transition:opacity .35s}
.lvup.show{opacity:1}
.lvup>*:not(.conf){position:relative;z-index:1}
.lvup .conf{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.lvup .conf i{position:absolute;width:8px;height:12px;border-radius:2px;top:-20px;animation:fall var(--t) var(--d) linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
.lvup .lvring{transform:scale(.4);transition:transform .8s var(--spring) .1s;margin-top:20px}
.lvup.show .lvring{transform:none}
.lvup .lvcore{inset:22px}
.lvup h2{font-family:var(--disp);font-size:30px;margin:26px 0 8px;text-align:center}
.lvup p{color:var(--hint);font-weight:600;text-align:center;margin:0 10px 22px;max-width:400px}
.rwcard{display:flex;gap:14px;align-items:center;width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;opacity:0;transform:translateY(16px);transition:all .5s var(--ease) .5s}
.lvup.show .rwcard{opacity:1;transform:none}
.rwcard .ri{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#8ccaff,#3b82f6);color:#fff}
.rwcard .ri.pp{background:var(--grad)}
.rwcard small{display:block;color:var(--ice);font-weight:800;font-size:11px;letter-spacing:1px}
.rwcard b{display:block;font-weight:800;font-size:16px;margin:2px 0}
.rwcard span{color:var(--hint);font-size:13px;font-weight:600}
.lvup .acts{margin-top:auto;width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px}
/* лига */
.lghead{display:flex;justify-content:space-between;align-items:center;padding:20px 2px 6px}
.timer{display:flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:800;font-size:13px}
.shields{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0 6px}
.shd{position:relative;display:grid;place-items:center}
.shd.cur{filter:drop-shadow(0 12px 26px rgba(229,80,138,.55))}
.shd.cur svg{animation:bump 1.2s var(--spring) .2s both}
.shd .lk{position:absolute;color:#6b6b88;top:52%;transform:translateY(-50%)}
.lgt{text-align:center;font-family:var(--disp);font-weight:700;font-size:22px;margin-top:8px}
.lgs{text-align:center;color:var(--hint);font-weight:600;font-size:14px;margin-top:4px}
.lghow{display:flex;gap:6px;align-items:center;justify-content:center;margin:12px auto 10px;color:var(--purple);font-weight:800;font-size:14px}
.lrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;margin-bottom:4px}
.lrow .pl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none;color:var(--hint)}
.lrow .pl.g1{background:#ffc35a;color:#2a1d00}.lrow .pl.g2{background:#d5d8e4;color:#22232e}.lrow .pl.g3{background:#d98b55;color:#2a1405}
.lrow .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#14141f;flex:none}
.lrow .meta b{display:block;font-weight:800;font-size:16px}
.lrow .meta span{color:var(--hint);font-size:12px;font-weight:600}
.lrow .x{font-weight:800}
.lrow.me{background:linear-gradient(90deg,rgba(122,77,255,.35),rgba(229,80,138,.18));box-shadow:inset 0 0 0 1.5px rgba(164,139,255,.7)}
.lrow.me .av{background:var(--grad)!important;color:#fff}
.zone{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.8px;margin:10px 4px 8px}
.zone::after{content:"";flex:1;height:1px;background:currentColor;opacity:.35}
.zone.up{color:var(--teal)}.zone.down{color:var(--danger)}
.skel{height:62px;border-radius:18px;margin-bottom:6px;background:linear-gradient(90deg,var(--card) 25%,var(--card2) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.lgempty{text-align:center;padding:18px 10px}
.lgempty p{color:var(--hint);font-weight:600;margin:6px 0 14px}
/* тема «Полночь» */
body.midnight{--grad:linear-gradient(135deg,#2563eb 0%,#0ea5e9 55%,#22d3ee 100%);--purple:#7cc4ff}
body.midnight .hero,body.midnight .scard{box-shadow:0 22px 44px -22px rgba(14,165,233,.75)}
body.sunset{--grad:linear-gradient(135deg,#ff8a3d 0%,#ff4f6d 55%,#d9468f 100%);--purple:#ffab7a}
body.sunset .hero,body.sunset .scard{box-shadow:0 22px 44px -22px rgba(255,95,90,.75)}
body.emerald{--grad:linear-gradient(135deg,#10b981 0%,#14b8a6 55%,#2f80ed 100%);--purple:#5eead4}
body.emerald .hero,body.emerald .scard{box-shadow:0 22px 44px -22px rgba(20,184,166,.75)}
/* ---------- магазин ---------- */
.star{color:#ffc35a}
.buy{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:14px;background:linear-gradient(135deg,#ffcf5a,#ff9f2e);color:#2a1a00;font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 10px 22px -12px rgba(255,170,50,.9);transition:transform .15s var(--ease)}
.buy:active{transform:scale(.94)}
.buy.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.buy.on{background:rgba(63,214,171,.14);color:var(--teal);box-shadow:none}
.shop-h{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.shop-h .si{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#ffcf5a,#ff9f2e);color:#2a1a00;flex:none;box-shadow:0 14px 28px -14px rgba(255,170,50,.9)}
.shop-h b{font-family:var(--disp);font-size:24px;display:block}
.shop-h span{color:var(--hint);font-size:13px;font-weight:600}
.sitem{display:flex;align-items:center;gap:12px;padding:12px 0}
.sitem+.sitem{border-top:1px solid var(--line)}
.sitem .ii{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.sitem .ii.ice{background:linear-gradient(135deg,#8ccaff,#3b82f6);color:#fff}
.sitem .ii.fire{background:var(--grad);color:#fff}
.sitem .ii.gold{background:rgba(255,195,90,.15);color:var(--gold)}
.sitem .meta{flex:1;min-width:0}
.sitem .meta b{display:block;font-weight:800}
.sitem .meta span{color:var(--hint);font-size:13px;font-weight:600}
.sitem .tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;background:rgba(63,214,171,.15);color:var(--teal);font-size:11px;font-weight:800;vertical-align:2px}
.repair{position:relative;overflow:hidden;border-radius:24px;padding:18px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,138,61,.22),rgba(229,80,138,.22));border:1px solid rgba(255,138,61,.35)}
.repair b{font-family:var(--disp);font-size:19px;display:block;margin:6px 0 4px}
.repair p{margin:0 0 14px;color:#f0d9e6;font-weight:600;font-size:14px}
.thg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thc{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.thc.act{border-color:rgba(63,214,171,.6)}
.thc .sw2{height:54px;border-radius:12px}
.thc b{font-size:13px;font-weight:800;text-align:center}
.thc .buy{height:34px;padding:0 8px;font-size:13px;justify-content:center}
.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tips .buy{justify-content:center;height:46px}
.banner.fix{border-color:rgba(255,138,61,.45);width:100%;text-align:left;color:var(--text)}
.banner.fix .bi{background:var(--grad);color:#fff}
.banner.fix .buy{height:34px;padding:0 12px;font-size:13px;margin-left:auto}
.shoprow{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.gitems{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.gitems button{padding:8px 12px;border-radius:12px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:13px}
.gitems button.on{background:rgba(164,139,255,.18);border-color:rgba(164,139,255,.6);color:var(--text)}
.gstep{display:flex;align-items:center;gap:12px;margin:4px 0 12px;font-weight:700}
.gstep button{width:38px;height:38px;border-radius:12px;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center}
.gmsg{margin-top:10px;font-weight:700;font-size:14px}
.gmsg.err{color:var(--danger)}
.pr{display:flex;align-items:center;gap:10px;padding:9px 0}
.pr+.pr{border-top:1px solid var(--line)}
.pr .meta{flex:1;min-width:0}
.pr .meta b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .meta span{color:var(--hint);font-size:12px;font-weight:600}
.pr .st2{font-weight:800;white-space:nowrap}
.pr .rf{padding:6px 10px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--danger)}
.pr .rfd{font-size:12px;font-weight:800;color:var(--hint)}
/* ---------- панель владельца ---------- */
.iconbtn.crown{color:var(--gold)}
.adm .tiles4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.chart i{flex:1;border-radius:4px 4px 2px 2px;background:var(--grad);min-height:3px;transform-origin:bottom;animation:grow .7s var(--ease) both;animation-delay:calc(var(--j) * 14ms)}
.chart.teal i{background:linear-gradient(to top,#1fae8c,#3fd6ab)}
.chart i.z{background:var(--soft)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chx{display:flex;justify-content:space-between;color:var(--hint);font-size:11px;font-weight:700;margin-top:6px}
.ret{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ret .tile b{font-size:22px}
.kv{display:flex;align-items:center;gap:10px;padding:8px 0}
.kv+.kv{border-top:1px solid var(--line)}
.kv span{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv b{font-weight:800}
.kv .pb{flex:1.2;height:8px}
.lim{margin-bottom:12px}
.lim .hb-h span:last-child{color:var(--hint);font-weight:700}
.lim .pb i{background:linear-gradient(90deg,#3fd6ab,#5aa8ff)}
.lim.warn .pb i{background:linear-gradient(90deg,#ffc35a,#ff6b6b)}
.cmdl{font-size:13px;color:var(--hint);font-weight:600;line-height:1.6}
.cmdl code{color:var(--text);font-weight:800;font-family:inherit;background:var(--soft);padding:1px 6px;border-radius:6px}
.fbbtn{margin-top:4px}
@media (prefers-reduced-motion:reduce){
  .view.enter.push,.view.enter .st{animation-name:fadeIn}
  .lvup .conf,.cele-parts{display:none}
}

}

}

function totalDays(h) { const t = todayKey(); let n = 0; for (let k = h.created; k <= t; k = addDays(k, 1)) if (scheduled(h, k) && success(h, k)) n++; return n; }

/* ---------- общая серия, заморозки, XP и уровни ----------
   День засчитывается, когда выполнены все привычки этого дня. Пропуск закрывает заморозка (серия сохраняется, но не растёт);
   без заморозок серия сгорает. +1 заморозка за каждые 7 дней серии. Слотов: 1, с 5 уровня — 2, с 8 — 3.
   XP: +10 за выполненную привычку (за «отказ» — в конце чистого дня), +20 за закрытый день, ×1,5 при серии от 7 дней.
   Всё считается из истории отметок, поэтому XP нельзя «накрутить» отдельно от привычек. */
const FREEZE_START = 1, FREEZE_EVERY = 7;
function streakSim(extraRep) {
  const rep = new Set([...(S.meta.rep || []), ...(extraRep || [])]);
  const t = todayKey(), r = { streak: 0, best: 0, freezes: FREEZE_START, todayDone: false, status: {}, earned: {}, xp: 0, dayXp: {}, level: 1, cap: 1, mult: 1, first: t };
  if (!S.habits.length) return r;
  let k = S.habits.reduce((m, h) => (h.created < m ? h.created : m), t), streak = 0;
  r.first = k;
  const gifts = (S.meta.gifts || []).map(g => ({ day: g.day, n: g.n, used: false }));
  for (let i = 0; i < 4000 && k <= t; i++) {
    for (const g of gifts) if (!g.used && g.day <= k) { r.freezes += g.n; g.used = true; }   // подарки владельца
    const hs = S.habits.filter(h => scheduled(h, k)), mult = streak >= XP_MULT_FROM ? XP_MULT : 1;
    let st;
    if (!hs.length) st = 'none';
    else if (hs.every(h => success(h, k))) st = 'done';
    else if (k === t) st = 'pending';
    else if (rep.has(k)) st = 'frozen';                       // починка серии из магазина
    else if (r.freezes > 0) { r.freezes--; st = 'frozen'; }
    else { st = 'missed'; streak = 0; }
    const n = hs.filter(h => success(h, k) && (h.type !== 'quit' || k < t)).length;
    const dx = Math.round((n * XP_HABIT + (st === 'done' ? XP_DAY : 0)) * mult);
    if (dx) { r.dayXp[k] = dx; r.xp += dx; }
    if (k === t) r.mult = mult;
    r.level = levelOf(r.xp); r.cap = freezeCap(r.level);
    if (st === 'done') { streak++; if (streak % FREEZE_EVERY === 0 && r.freezes < r.cap) { r.freezes++; r.earned[k] = true; } }
    r.best = Math.max(r.best, streak); r.status[k] = st; k = addDays(k, 1);
  }
  r.streak = streak; r.todayDone = r.status[t] === 'done';
  return r;
}

async function deleteHabit(id) {
  if (!await ask('Удалить привычку и всю её историю?')) return;
  const months = new Set(Object.keys(S.log[id] || {}).map(d => d.slice(0, 4) + d.slice(5, 7)));
  const keys = ['h_' + id, ...[...months].map(m => `l_${id}_${m}`)];
  keys.forEach(k => dirty.delete(k));
  S.habits = S.habits.filter(h => h.id !== id); delete S.log[id];

}

async function buy(item) {
  if (!inTG || !ver('6.1') || !tg.openInvoice) { toast('Покупки работают внутри Telegram'); return; }

async function afterPay(item) {
  const before = JSON.stringify([S.meta.gifts, S.meta.themes, S.meta.rep]);
  for (let i = 0; i < 6; i++) {
    await new Promise(r => setTimeout(r, 1200));
    await whoami();
    if (JSON.stringify([S.meta.gifts, S.meta.themes, S.meta.rep]) !== before || item.startsWith('tip')) break;
  }
  if (item.startsWith('theme_')) { S.meta.theme = item.slice(6); saveMeta(); }
  S.lastView = null; render();
  if (item === 'repair') celebrate(S.sim.streak, false, 'Серия восстановлена — огонёк снова горит!');
  else toast(item.startsWith('tip') ? 'Спасибо за поддержку! 💜' : '✅ Покупка добавлена');
}
async function repairFree() {
  const off = repairOffer(); if (!off) return;
  try {
    const j = await api('/api/repair', { days: off.days }); if (!j.ok) throw new Error(j.error);
    applyPerks(j.perks); S.lastView = null; render(); hap.ok(); celebrate(S.sim.streak, false, 'Серия восстановлена — подарок сработал!');

function applyPerks(pk) {

  S.meta.themes = pk.themes || []; S.meta.rep = pk.repairs || []; S.meta.repc = pk.repc || 0;

}

let SW = null, suppressClick = 0, pendingDel = null;

}
function commitDelete() {
  if (!pendingDel) return;
  const p = pendingDel; pendingDel = null; clearTimeout(p.timer); p.toast && p.toast.remove();
  const id = p.h.id, months = new Set(Object.keys(p.log || {}).map(d => d.slice(0, 4) + d.slice(5, 7)));
  const keys = ['h_' + id, ...[...months].map(m => `l_${id}_${m}`)];
  keys.forEach(k => dirty.delete(k));
  store.remove(keys).catch(err => console.error(err));
  scheduleSync();
}
function undoDelete() {
  if (!pendingDel) return;
  const p = pendingDel; pendingDel = null; clearTimeout(p.timer); p.toast && p.toast.remove();
  if (!H(p.h.id)) { S.habits.splice(Math.min(p.idx, S.habits.length), 0, p.h); if (p.log) S.log[p.h.id] = p.log; }
  S.pulse = p.h.id; hap.tap(); render(); scheduleSync();
}
actions.undo = () => undoDelete();

/* ---------- старт ---------- */
(async function init() {
  await load();
  const sim0 = streakSim();
  if (!S.meta.lvl) { S.meta.lvl = sim0.level; saveMeta(); }     // первый запуск после обновления — без салюта
  if (!S.meta.wk2) { S.meta.wk2 = 1; if (!S.cfg.week.on) { S.cfg.week.on = true; saveCfg(); } saveMeta(); }   // 2.2: итоги недели включены
  render();
  if (sim0.level > S.meta.lvl) { S.meta.lvl = sim0.level; saveMeta(); setTimeout(() => levelUp(sim0.level), 600); }
  whoami();
  setTimeout(loadLeague, 2500);
  scheduleSync();
  if (inTG && ver('6.1')) tg.BackButton.onClick(goBack);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { commitDelete(); flush(); return; }
    if (S.lastToday !== todayKey()) { S.lastToday = todayKey(); S.sel = todayKey(); render(); scheduleSync(); }
    whoami();
  });
})();
</script>
